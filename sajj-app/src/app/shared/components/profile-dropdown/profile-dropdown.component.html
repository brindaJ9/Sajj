<div class="profile-dropdown" (clickOutside)="closeDropdown()">
  <button class="profile-trigger" (click)="toggleDropdown()" type="button">
    <div class="profile-avatar">
      <span class="avatar-initial">{{ userName.charAt(0) }}</span>
    </div>
    <div class="profile-info">
      <span class="profile-greeting">Hi, {{ userName }}</span>
    </div>
    <span class="dropdown-icon" [class.open]="isOpen()">▼</span>
  </button>

  @if (isOpen()) {
    <div class="dropdown-menu">
      <button class="dropdown-item" (click)="navigateToProfile()" type="button">
        <span class="item-icon">👤</span>
        <span class="item-label">Your Profile</span>
      </button>
      <div class="dropdown-divider"></div>
      <button class="dropdown-item logout" (click)="logout()" type="button">
        <span class="item-icon">🚪</span>
        <span class="item-label">Logout</span>
      </button>
    </div>
  }
</div>
