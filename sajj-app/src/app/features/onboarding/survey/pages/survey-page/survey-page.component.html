<div class="survey-container">
  <div class="survey-header">
    <h1 class="brand-title">Sajj</h1>
  </div>

  <div class="survey-card">
    <app-progress-bar
      [current]="currentStep"
      [total]="totalSteps">
    </app-progress-bar>

    <app-question-card
      [question]="questions[currentStep]"
      [selectedAnswer]="answers[questions[currentStep].id]"
      (selectedOption)="selectAnswer(questions[currentStep].id, $event)">
    </app-question-card>

    <div class="navigation">
      <button
        class="next-button"
        (click)="nextQuestion()"
        [disabled]="!canProceed()">
        {{ currentStep === totalSteps - 1 ? 'Finish' : 'Next' }} →
      </button>
    </div>
  </div>
</div>
